<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Reaper architecture</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --text: #1f2430;
      --muted: #5d6676;
      --line: #6b7385;
      --agent-fill: #e6e0ff;
      --agent-stroke: #6c4ee0;
      --source-fill: #dff3ff;
      --source-stroke: #1b84c4;
      --work-fill: #fff2d9;
      --work-stroke: #d68a00;
      --out-fill: #dff7e8;
      --out-stroke: #1f9d55;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171f;
        --text: #eef0f5;
        --muted: #a2a9b8;
        --line: #8f98ab;
        --agent-fill: #2d2658;
        --agent-stroke: #9b84ff;
        --source-fill: #12344a;
        --source-stroke: #4fb3ee;
        --work-fill: #433210;
        --work-stroke: #f0b44a;
        --out-fill: #123d26;
        --out-stroke: #4fd187;
      }
    }
    .bg { fill: var(--bg); }
    .title { font-size: 28px; font-weight: 700; fill: var(--text); letter-spacing: 6px; }
    .name { font-size: 20px; font-weight: 650; fill: var(--text); text-anchor: middle; }
    .sub { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .label { font-size: 13px; fill: var(--muted); text-anchor: middle; }
    .arrow { stroke: var(--line); stroke-width: 2.5; fill: none; marker-end: url(#head); }
    .agent { fill: var(--agent-fill); stroke: var(--agent-stroke); stroke-width: 3; }
    .source { fill: var(--source-fill); stroke: var(--source-stroke); stroke-width: 2.5; }
    .work { fill: var(--work-fill); stroke: var(--work-stroke); stroke-width: 2.5; }
    .out { fill: var(--out-fill); stroke: var(--out-stroke); stroke-width: 2.5; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)" />
    </marker>
  </defs>

  <rect class="bg" width="1100" height="520" />
  <text class="title" x="550" y="48" text-anchor="middle">REAPER</text>

  <!-- Top row: arXiv <-> Agent -> Discord -->
  <rect class="source" x="30" y="90" width="200" height="80" rx="14" />
  <text class="name" x="130" y="125">arXiv</text>
  <text class="sub" x="130" y="149">/list/cs/new</text>

  <rect class="agent" x="450" y="85" width="200" height="90" rx="16" />
  <text class="name" x="550" y="125">Agent</text>
  <text class="sub" x="550" y="149">the orchestrator</text>

  <rect class="out" x="870" y="90" width="200" height="80" rx="14" />
  <text class="name" x="970" y="125">Discord</text>
  <text class="sub" x="970" y="149">#reaper</text>

  <path class="arrow" d="M448 112 L232 112" />
  <text class="label" x="340" y="102">asks for new papers</text>
  <path class="arrow" d="M232 148 L448 148" />
  <text class="label" x="340" y="172">paper list</text>

  <path class="arrow" d="M652 130 L868 130" />
  <text class="label" x="760" y="120">posts summary</text>

  <!-- Bottom row: Read -> Model -> Summary -->
  <rect class="work" x="150" y="330" width="200" height="80" rx="14" />
  <text class="name" x="250" y="365">Read paper</text>
  <text class="sub" x="250" y="389">extract the text</text>

  <rect class="work" x="450" y="330" width="200" height="80" rx="14" />
  <text class="name" x="550" y="365">Local free model</text>
  <text class="sub" x="550" y="389">runs on your computer</text>

  <rect class="work" x="750" y="330" width="200" height="80" rx="14" />
  <text class="name" x="850" y="365">Summary</text>
  <text class="sub" x="850" y="389">short and readable</text>

  <!-- Agent -> Read paper -->
  <path class="arrow" d="M500 177 L500 250 L250 250 L250 328" />
  <text class="label" x="375" y="240">hands over paper</text>

  <path class="arrow" d="M352 370 L448 370" />
  <path class="arrow" d="M652 370 L748 370" />

  <!-- Summary -> Agent -->
  <path class="arrow" d="M850 328 L850 250 L600 250 L600 177" />
  <text class="label" x="725" y="240">summary returns</text>

</svg>
